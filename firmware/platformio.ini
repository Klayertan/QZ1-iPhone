; QZ1 iPhone bridge: QZ1 (Bluetooth Classic SPP) -> M5Stack Core2 -> the phone (Wi-Fi or Bluetooth LE).
; Build:   pio run -e m5stack-core2
; Flash:   pio run -e m5stack-core2 -t upload
; The Core2 must be a CLASSIC ESP32 (Core / Core2). An ESP32-S3 (CoreS3) has no
; Bluetooth Classic and cannot talk to the blue QZ1. See the README.
[env:m5stack-core2]
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default_16MB.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Unified@^0.1.17
    links2004/WebSockets@^2.4.1

; Same firmware with the Arduino/Bluetooth stack's own log messages (what pairing or
; the serial-service lookup says when connect fails). Flash with: pio run -e m5stack-core2-debug -t upload
[env:m5stack-core2-debug]
extends = env:m5stack-core2
build_flags =
    -DCORE_DEBUG_LEVEL=4
