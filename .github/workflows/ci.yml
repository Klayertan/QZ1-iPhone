name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Viewer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  firmware:
    name: Firmware compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: cp firmware/src/config.example.h firmware/src/config.h
      - run: pio run -e m5stack-core2
        working-directory: firmware
